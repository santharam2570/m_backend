<!doctype html>
<html>
  <body style="font-family: Arial, sans-serif; color: #1a2332; background: #f8f9fb; padding: 24px;">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px;">
      <tr>
        <td style="text-align: center;">
          {% if logo %}<img src="{{ logo }}" alt="MAP" style="height: 48px; margin-bottom: 24px;" />{% endif %}
          <h1 style="font-size: 22px; margin: 0 0 12px;">Your new password</h1>
          {% if user_name %}
          <p style="color: #6b7280; margin: 0 0 16px;">Hi {{ user_name }},</p>
          {% endif %}
          <p style="color: #6b7280; margin: 0 0 24px;">Use the password below to sign in to your MAP account.</p>
          <div style="display: inline-block; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px 24px; margin-bottom: 24px;">
            <span style="font-size: 22px; font-weight: 700; letter-spacing: 2px; color: #0f2b4a;">{{ generated_password }}</span>
          </div>
          <p style="color: #9aa3b2; font-size: 13px; margin: 0;">For security, change this password after logging in.</p>
          <p style="color: #9aa3b2; font-size: 13px; margin: 16px 0 0;">If you did not request this, please contact your administrator.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
