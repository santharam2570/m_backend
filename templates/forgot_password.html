<!doctype html>
<html>
  <body style="font-family: Arial, sans-serif; color: #1a2332; background: #f8f9fb; padding: 24px;">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px;">
      <tr>
        <td style="text-align: center;">
          {% if logo %}<img src="{{ logo }}" alt="MAP" style="height: 48px; margin-bottom: 24px;" />{% endif %}
          <h1 style="font-size: 22px; margin: 0 0 12px;">Reset your password</h1>
          <p style="color: #6b7280; margin: 0 0 24px;">Click the button below to choose a new password for your MAP account.</p>
          <a href="{{ reset_password_url }}" style="display: inline-block; background: #0f2b4a; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600;">Reset Password</a>
          <p style="color: #9aa3b2; font-size: 13px; margin: 24px 0 0;">If you did not request a password reset, you can ignore this email.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
