<!doctype html>
<html>
  <body style="font-family: Arial, sans-serif; color: #1a2332; background: #f8f9fb; padding: 24px;">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px;">
      <tr>
        <td style="text-align: center;">
          {% if logo %}<img src="{{ logo }}" alt="MAP" style="height: 48px; margin-bottom: 24px;" />{% endif %}
          <h1 style="font-size: 22px; margin: 0 0 12px;">2-Step Verification</h1>
          <p style="color: #6b7280; margin: 0 0 24px;">Use the code below to complete your sign in.</p>
          <div style="font-size: 32px; letter-spacing: 8px; font-weight: 700; color: #0f2b4a; margin-bottom: 24px;">{{ verify_otp }}</div>
          <p style="color: #9aa3b2; font-size: 13px; margin: 0;">If you did not request this code, you can ignore this email.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
