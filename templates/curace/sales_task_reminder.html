<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Task Reminder</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; line-height: 1.5;">
  <div style="max-width: 600px; margin: 0 auto; padding: 24px;">
    {% if logo %}
    <img src="{{ logo }}" alt="Logo" style="max-width: 180px; margin-bottom: 24px;">
    {% endif %}

    <h2 style="margin: 0 0 16px;">Task Reminder</h2>
    <p>You have been assigned a new CRM task.</p>

    <table style="width: 100%; border-collapse: collapse; margin: 20px 0;">
      <tr>
        <td style="padding: 8px 0; font-weight: bold; width: 140px;">Task</td>
        <td style="padding: 8px 0;">{{ task_title or '-' }}</td>
      </tr>
      <tr>
        <td style="padding: 8px 0; font-weight: bold;">Related To</td>
        <td style="padding: 8px 0;">{{ company_name or '-' }}</td>
      </tr>
      <tr>
        <td style="padding: 8px 0; font-weight: bold;">Date</td>
        <td style="padding: 8px 0;">{{ date or '-' }}</td>
      </tr>
      <tr>
        <td style="padding: 8px 0; font-weight: bold;">Time</td>
        <td style="padding: 8px 0;">{{ time or '-' }}</td>
      </tr>
    </table>

    {% if company_detail_url %}
    <p>
      <a href="{{ company_detail_url }}" style="display: inline-block; background: #2563eb; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 6px;">
        View Details
      </a>
    </p>
    {% endif %}
  </div>
</body>
</html>
